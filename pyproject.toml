[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haidc"
version = "0.0.0"
description = "HCT-vs-L2D head-to-head on the Galaxy Zoo binary subset."
requires-python = ">=3.11"
# Runtime deps live in requirements.txt (pinned by `make env`); install with
# `pip install -e . --no-deps` so this file is not a second source of truth.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` = trains the scratch resnet50 backbone (M2); CPU-prohibitive (one 60-epoch overfit
# backward pass alone exceeds 30s), so deselected by default and a 60s per-test timeout guards
# against any future hang. These tests validate on a Colab GPU: run `pytest -m slow`. See
# docs/HANDOFF.md §3a and tests/README.md.
addopts = "-q --timeout=60 -m 'not slow'"
markers = [
    "slow: trains the scratch resnet50 backbone; CPU-prohibitive, run on GPU (HANDOFF §3a)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
